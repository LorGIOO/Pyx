name: Release

# Publica los instaladores de Windows, macOS y Linux cuando se empuja una
# etiqueta de versión (por ejemplo `v1.1.0`). Cada sistema se compila en su
# runner nativo (Tauri no permite compilación cruzada) y los tres suben sus
# instaladores al MISMO borrador de Release.
#
# Lanzado a mano con una versión que YA está publicada, la vuelve a construir:
# sus instaladores se sustituyen y su etiqueta pasa al commit elegido.
#
# También se puede lanzar a mano (Actions → Release → Run workflow) indicando
# la versión: la etiqueta se crea entonces sobre el commit elegido. Antes se
# podía lanzar a mano sin versión, y la release salía con el nombre de la rama.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a publicar, con la v delante (p. ej. v1.5.0). Debe coincidir con la de package.json.'
        required: true

permissions:
  contents: write

# La etiqueta de esta publicación, venga de un push o del lanzamiento manual.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # UN solo borrador para los tres sistemas. Antes cada runner lo buscaba y,
  # si no existía, lo creaba: dos que llegaban a la vez creaban DOS borradores
  # con la misma etiqueta y los instaladores se repartían entre ellos (la
  # 2.2.2 se quedó sin el de Windows en el suyo). Aquí se crea primero, se
  # borran los duplicados de intentos anteriores y los runners suben a ESTE
  # por su id.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            Instaladores: Windows (`.exe`), macOS (`.dmg`, universal Intel+Apple Silicon) y Linux (`.deb` / `.rpm` / `.AppImage`), y el **manual de usuario** de esta versión en PDF, en español y en inglés (*user manual*).

            Novedades de esta versión en el [CHANGELOG](https://github.com/LorGIOO/Pyx/blob/main/CHANGELOG.md).

            No hace falta instalar nada más: si el equipo no tiene Python o LaTeX, Pyx ofrece prepararlos al arrancar (Python con uv, LaTeX con Tectonic), dentro de su propia carpeta. Si ya tienes Python, MiKTeX, MacTeX o TeX Live, Pyx los usa.
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          ids=$(gh api --paginate "$api?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          keep=""
          for id in $ids; do
            if [ -z "$keep" ]; then keep=$id
            else echo "Borrador duplicado $id: borrado"; gh api -X DELETE "$api/$id"; fi
          done
          if [ -z "$keep" ]; then
            keep=$(gh api -X POST "$api" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Pyx $RELEASE_TAG" -f body="$BODY" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "Release $RELEASE_TAG: $keep"
          echo "id=$keep" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          # Binario universal: un único .dmg para Macs Intel y Apple Silicon.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Una release v1.5.0 que contenga una app que dice ser la 1.4.0 es el
      # error que nadie ve hasta que un usuario lo reporta: se para aquí.
      - name: Comprobar que la etiqueta coincide con la versión de la app
        shell: bash
        run: |
          app="v$(node -p "require('./package.json').version")"
          tauri="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "$app" ] || [ "$RELEASE_TAG" != "$tauri" ]; then
            echo "::error::La etiqueta $RELEASE_TAG no coincide con package.json ($app) / tauri.conf.json ($tauri)."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust
        # Versión de Rust FIJA. Con «stable», la 1.8.0 salió con Rust 1.100.0
        # (publicado el 9-11-2026) y Kaspersky marcaba su pyx.exe como
        # VHO:Trojan.Win32.Convagent.gen y bloqueaba el instalador; el mismo
        # código con Rust 1.99.1 (el de la 1.7.0) se analiza limpio. Subirla
        # solo comprobando antes los instaladores con un antivirus.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          # macOS universal necesita ambas arquitecturas.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # tauri-action ejecuta `npm run build` (beforeBuildCommand) + `tauri build`
      # y sube los instaladores al borrador de release de la etiqueta.
      - name: Compilar y publicar los instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # El borrador que creó `prepare`: los tres sistemas suben al mismo.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

      # ---- Windows: firma y antivirus, antes de que nadie lo descargue ----
      #
      # «Windows no tiene acceso al dispositivo, ruta de acceso o archivo» al
      # abrir el instalador es un antivirus (Kaspersky, en las 1.8.0 y 2.2.0)
      # que bloquea un .exe SIN FIRMAR que su heurística no reconoce. Dos
      # defensas:
      #
      # 1. Firma con SignPath (gratuita para software libre: ver
      #    https://lorgioo.github.io/Pyx-web/firma/). Se activa sola en cuanto
      #    existan el secreto SIGNPATH_API_TOKEN y la variable
      #    SIGNPATH_ORGANIZATION_ID; sin ellos se salta.
      - name: Preparar la firma (Windows)
        id: firma
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Instaladores de Windows SIN FIRMAR: falta SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID."; fi

      - name: Subir los instaladores sin firmar (para SignPath)
        id: sinfirmar
        if: steps.firma.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-sin-firmar
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Firmar con SignPath
        if: steps.firma.outputs.on == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Pyx' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sinfirmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmados

      - name: Publicar los instaladores firmados
        if: steps.firma.outputs.on == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l firmados
          find firmados -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} src-tauri/target/release/bundle/ \;
          for f in firmados/*-setup.exe firmados/*.msi firmados/**/*-setup.exe firmados/**/*.msi; do
            [ -f "$f" ] && gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done

      # 2. Antivirus: Microsoft Defender (el del propio runner, con firmas
      #    recién actualizadas) analiza el programa y los dos instaladores.
      #    Si encuentra algo, este paso falla, la release no se publica y el
      #    aviso dice qué archivo y qué amenaza.
      - name: Analizar con Microsoft Defender (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "::warning::Defender no está en este runner: análisis saltado."; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          $files = @(Get-ChildItem src-tauri/target/release/pyx.exe, src-tauri/target/release/bundle/nsis/*-setup.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)
          $bad = @()
          foreach ($f in $files) {
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $bad += $f.Name }
            else { Write-Host "Limpio: $($f.Name)" }
          }
          if ($bad.Count) { Write-Host "::error::Defender detecta una amenaza en: $($bad -join ', ')"; exit 1 }

  # La release se crea en BORRADOR para que nadie descargue una versión a la
  # que todavía le falta la mitad de los instaladores: los tres runners tardan
  # cosas distintas y suben al mismo borrador. Cuando los tres han terminado
  # bien, este paso la publica. Si alguno falla, el borrador se queda sin
  # publicar, que es exactamente lo que debe pasar.
  publish:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Una versión publicada otra vez: su etiqueta pasa a ESTE commit, para
      # que el código de la release sea el de sus instaladores.
      - name: Llevar la etiqueta a este commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ "$(git rev-parse "refs/tags/$RELEASE_TAG" 2>/dev/null)" != "$GITHUB_SHA" ]; then
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$RELEASE_TAG"
          fi

      # El manual de usuario de ESTA versión, junto a sus instaladores.
      - name: Adjuntar el manual de usuario
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manual="Pyx_${RELEASE_TAG#v}_manual_de_usuario.pdf"
          cp "Manual de usuario/Manual de usuario de Pyx.pdf" "$manual"
          gh release upload "$RELEASE_TAG" "$manual" --repo "$GITHUB_REPOSITORY" --clobber
          # …and in English, when this version has it.
          if [ -f "Manual de usuario/Pyx user manual.pdf" ]; then
            manual_en="Pyx_${RELEASE_TAG#v}_user_manual.pdf"
            cp "Manual de usuario/Pyx user manual.pdf" "$manual_en"
            gh release upload "$RELEASE_TAG" "$manual_en" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # pyx-update.json: lo que «Buscar actualizaciones» lee para saber cuál
      # es la última versión y la huella SHA-256 de cada paquete (update.rs).
      # Es una descarga corriente (releases/latest/download/pyx-update.json),
      # no una consulta a la API de GitHub, que solo admite 60 por hora y por
      # dirección pública: con Pyx abierto en un aula entera, la comprobación
      # fallaba para todos. Las huellas se calculan aquí sobre los mismos
      # archivos que se van a publicar.
      - name: Adjuntar pyx-update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir paquetes
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir paquetes \
            --pattern '*_x64-setup.exe' --pattern '*.AppImage' --pattern '*.app.tar.gz'
          ls -l paquetes
          # Sin el instalador de Windows no hay nada que anunciar: se para aquí
          # y la release se queda en borrador.
          ls paquetes/*_x64-setup.exe >/dev/null
          assets='[]'
          for f in paquetes/*; do
            assets=$(jq -c --arg name "$(basename "$f")" --argjson size "$(stat -c %s "$f")" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + [{name: $name, size: $size, sha256: $sha}]' <<<"$assets")
          done
          jq -n --arg version "${RELEASE_TAG#v}" --argjson assets "$assets" \
            '{version: $version, assets: $assets}' > pyx-update.json
          cat pyx-update.json
          gh release upload "$RELEASE_TAG" pyx-update.json --repo "$GITHUB_REPOSITORY" --clobber

      # 3. VirusTotal: los instaladores de Windows, analizados por unos 70
      #    antivirus, Kaspersky entre ellos. Con el secreto VT_API_KEY (una
      #    cuenta gratuita de virustotal.com basta) la release NO se publica
      #    si Kaspersky, Microsoft, ESET, Bitdefender, Avast, AVG, Norton,
      #    McAfee o más de dos motores los marcan; queda en borrador.
      - name: Analizar con VirusTotal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT" ]; then echo "::warning::Sin VT_API_KEY: VirusTotal saltado."; exit 0; fi
          mkdir -p vt
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir vt --pattern '*_x64-setup.exe' --pattern '*.msi' --clobber
          fail=0
          for f in vt/*; do
            url=$(curl -s -H "x-apikey: $VT" https://www.virustotal.com/api/v3/files/upload_url | jq -r '.data // empty')
            [ -z "$url" ] && url=https://www.virustotal.com/api/v3/files
            id=$(curl -s -H "x-apikey: $VT" -F "file=@$f" "$url" | jq -r '.data.id')
            for i in $(seq 1 60); do
              r=$(curl -s -H "x-apikey: $VT" "https://www.virustotal.com/api/v3/analyses/$id")
              [ "$(jq -r '.data.attributes.status' <<<"$r")" = completed ] && break
              sleep 20
            done
            n=$(jq '[.data.attributes.results[] | select(.category=="malicious" or .category=="suspicious")] | length' <<<"$r")
            big=$(jq -r '[.data.attributes.results | to_entries[] | select(.value.category=="malicious" or .value.category=="suspicious") | select(.key|test("Kaspersky|Microsoft|ESET|BitDefender|Avast|AVG|Symantec|McAfee";"i")) | "\(.key): \(.value.result)"] | join("; ")' <<<"$r")
            echo "$(basename "$f"): $n detecciones ${big:+— $big}"
            if [ -n "$big" ] || [ "$n" -gt 2 ]; then echo "::error::VirusTotal: $(basename "$f") marcado ($n). $big"; fail=1; fi
          done
          exit $fail

      # Solo lo que ya está en main es la versión «latest», la que ofrece
      # «Buscar actualizaciones» a todos los usuarios (update.rs lee
      # releases/latest/download/pyx-update.json). Una etiqueta sobre otra rama (p. ej. `remote`) sale
      # como PRE-LANZAMIENTO: se puede descargar, pero no llega sola a nadie.
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            kind="--latest"
          else
            kind="--prerelease"
          fi
          echo "Publicando $RELEASE_TAG con $kind"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            $kind
