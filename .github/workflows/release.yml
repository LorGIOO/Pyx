name: Release

# Publica los instaladores de Windows, macOS y Linux cuando se empuja una
# etiqueta de versión (por ejemplo `v1.1.0`). Cada sistema se compila en su
# runner nativo (Tauri no permite compilación cruzada) y los tres suben sus
# instaladores al MISMO borrador de Release.
#
# También se puede lanzar a mano (Actions → Release → Run workflow) indicando
# la versión: la etiqueta se crea entonces sobre el commit elegido. Antes se
# podía lanzar a mano sin versión, y la release salía con el nombre de la rama.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a publicar, con la v delante (p. ej. v1.5.0). Debe coincidir con la de package.json.'
        required: true

permissions:
  contents: write

# La etiqueta de esta publicación, venga de un push o del lanzamiento manual.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          # Binario universal: un único .dmg para Macs Intel y Apple Silicon.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Una release v1.5.0 que contenga una app que dice ser la 1.4.0 es el
      # error que nadie ve hasta que un usuario lo reporta: se para aquí.
      - name: Comprobar que la etiqueta coincide con la versión de la app
        shell: bash
        run: |
          app="v$(node -p "require('./package.json').version")"
          tauri="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "$app" ] || [ "$RELEASE_TAG" != "$tauri" ]; then
            echo "::error::La etiqueta $RELEASE_TAG no coincide con package.json ($app) / tauri.conf.json ($tauri)."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust
        # Versión de Rust FIJA. Con «stable», la 1.8.0 salió con Rust 1.100.0
        # (publicado el 9-11-2026) y Kaspersky marcaba su pyx.exe como
        # VHO:Trojan.Win32.Convagent.gen y bloqueaba el instalador; el mismo
        # código con Rust 1.99.1 (el de la 1.7.0) se analiza limpio. Subirla
        # solo comprobando antes los instaladores con un antivirus.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          # macOS universal necesita ambas arquitecturas.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # tauri-action ejecuta `npm run build` (beforeBuildCommand) + `tauri build`
      # y sube los instaladores al borrador de release de la etiqueta.
      - name: Compilar y publicar los instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Pyx ${{ env.RELEASE_TAG }}'
          # Sobre ESTE commit: lo que se lanzó a mano crea aquí la etiqueta.
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Instaladores: Windows (`.exe`), macOS (`.dmg`, universal Intel+Apple Silicon) y Linux (`.deb` / `.rpm` / `.AppImage`), y el **manual de usuario** de esta versión en PDF, en español y en inglés (*user manual*).

            Novedades de esta versión en el [CHANGELOG](https://github.com/LorGIOO/Pyx/blob/main/CHANGELOG.md).

            No hace falta instalar nada más: si el equipo no tiene Python o LaTeX, Pyx ofrece prepararlos al arrancar (Python con uv, LaTeX con Tectonic), dentro de su propia carpeta. Si ya tienes Python, MiKTeX, MacTeX o TeX Live, Pyx los usa.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # La release se crea en BORRADOR para que nadie descargue una versión a la
  # que todavía le falta la mitad de los instaladores: los tres runners tardan
  # cosas distintas y suben al mismo borrador. Cuando los tres han terminado
  # bien, este paso la publica. Si alguno falla, el borrador se queda sin
  # publicar, que es exactamente lo que debe pasar.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El manual de usuario de ESTA versión, junto a sus instaladores.
      - name: Adjuntar el manual de usuario
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manual="Pyx_${RELEASE_TAG#v}_manual_de_usuario.pdf"
          cp "Manual de usuario/Manual de usuario de Pyx.pdf" "$manual"
          gh release upload "$RELEASE_TAG" "$manual" --repo "$GITHUB_REPOSITORY" --clobber
          # …and in English, when this version has it.
          if [ -f "Manual de usuario/Pyx user manual.pdf" ]; then
            manual_en="Pyx_${RELEASE_TAG#v}_user_manual.pdf"
            cp "Manual de usuario/Pyx user manual.pdf" "$manual_en"
            gh release upload "$RELEASE_TAG" "$manual_en" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # pyx-update.json: lo que «Buscar actualizaciones» lee para saber cuál
      # es la última versión y la huella SHA-256 de cada paquete (update.rs).
      # Es una descarga corriente (releases/latest/download/pyx-update.json),
      # no una consulta a la API de GitHub, que solo admite 60 por hora y por
      # dirección pública: con Pyx abierto en un aula entera, la comprobación
      # fallaba para todos. Las huellas se calculan aquí sobre los mismos
      # archivos que se van a publicar.
      - name: Adjuntar pyx-update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir paquetes
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir paquetes \
            --pattern '*_x64-setup.exe' --pattern '*.AppImage' --pattern '*.app.tar.gz'
          ls -l paquetes
          # Sin el instalador de Windows no hay nada que anunciar: se para aquí
          # y la release se queda en borrador.
          ls paquetes/*_x64-setup.exe >/dev/null
          assets='[]'
          for f in paquetes/*; do
            assets=$(jq -c --arg name "$(basename "$f")" --argjson size "$(stat -c %s "$f")" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + [{name: $name, size: $size, sha256: $sha}]' <<<"$assets")
          done
          jq -n --arg version "${RELEASE_TAG#v}" --argjson assets "$assets" \
            '{version: $version, assets: $assets}' > pyx-update.json
          cat pyx-update.json
          gh release upload "$RELEASE_TAG" pyx-update.json --repo "$GITHUB_REPOSITORY" --clobber

      # Solo lo que ya está en main es la versión «latest», la que ofrece
      # «Buscar actualizaciones» a todos los usuarios (update.rs lee
      # releases/latest/download/pyx-update.json). Una etiqueta sobre otra rama (p. ej. `remote`) sale
      # como PRE-LANZAMIENTO: se puede descargar, pero no llega sola a nadie.
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            kind="--latest"
          else
            kind="--prerelease"
          fi
          echo "Publicando $RELEASE_TAG con $kind"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            $kind
