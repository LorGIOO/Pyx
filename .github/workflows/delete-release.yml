name: Borrar una versión

# Borra una release (y sus borradores duplicados) y su etiqueta. Se lanza a
# mano: Actions → Borrar una versión → Run workflow, con la versión (v2.2.2).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a borrar, con la v delante (p. ej. v2.2.2).'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Versión no válida: $TAG"; exit 1;; esac
          api="repos/$GITHUB_REPOSITORY/releases"
          for id in $(gh api --paginate "$api?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id"); do
            echo "Release $id borrada"; gh api -X DELETE "$api/$id"
          done
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" && echo "Etiqueta $TAG borrada"
          fi
