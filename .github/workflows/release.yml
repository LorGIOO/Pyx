name: Release

# Publica los instaladores de Windows, macOS y Linux cuando se empuja una
# etiqueta de versión (por ejemplo `v1.1.0`). Cada sistema se compila en su
# runner nativo (Tauri no permite compilación cruzada) y los tres suben sus
# instaladores al MISMO borrador de Release.
#
# También se puede lanzar a mano (Actions → Release → Run workflow) indicando
# la versión: la etiqueta se crea entonces sobre el commit elegido. Antes se
# podía lanzar a mano sin versión, y la release salía con el nombre de la rama.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a publicar, con la v delante (p. ej. v1.5.0). Debe coincidir con la de package.json.'
        required: true

permissions:
  contents: write

# La etiqueta de esta publicación, venga de un push o del lanzamiento manual.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          # Binario universal: un único .dmg para Macs Intel y Apple Silicon.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Una release v1.5.0 que contenga una app que dice ser la 1.4.0 es el
      # error que nadie ve hasta que un usuario lo reporta: se para aquí.
      - name: Comprobar que la etiqueta coincide con la versión de la app
        shell: bash
        run: |
          app="v$(node -p "require('./package.json').version")"
          tauri="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "$app" ] || [ "$RELEASE_TAG" != "$tauri" ]; then
            echo "::error::La etiqueta $RELEASE_TAG no coincide con package.json ($app) / tauri.conf.json ($tauri)."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal necesita ambas arquitecturas.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # tauri-action ejecuta `npm run build` (beforeBuildCommand) + `tauri build`
      # y sube los instaladores al borrador de release de la etiqueta.
      - name: Compilar y publicar los instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Pyx ${{ env.RELEASE_TAG }}'
          # Sobre ESTE commit: lo que se lanzó a mano crea aquí la etiqueta.
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Instaladores adjuntos abajo: Windows (`.exe`), macOS (`.dmg`, universal Intel+Apple Silicon) y Linux (`.deb` / `.rpm` / `.AppImage`).

            Novedades de esta versión en el [CHANGELOG](https://github.com/LorGIOO/Pyx/blob/main/CHANGELOG.md).

            No hace falta instalar nada más: si el equipo no tiene Python o LaTeX, Pyx ofrece prepararlos al arrancar (Python con uv, LaTeX con Tectonic), dentro de su propia carpeta. Si ya tienes Python, MiKTeX, MacTeX o TeX Live, Pyx los usa.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # La release se crea en BORRADOR para que nadie descargue una versión a la
  # que todavía le falta la mitad de los instaladores: los tres runners tardan
  # cosas distintas y suben al mismo borrador. Cuando los tres han terminado
  # bien, este paso la publica. Si alguno falla, el borrador se queda sin
  # publicar, que es exactamente lo que debe pasar.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
