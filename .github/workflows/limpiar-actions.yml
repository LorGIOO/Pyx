# De un solo uso: libera el espacio de GitHub Actions. Borra todas las
# ejecuciones TERMINADAS (con sus registros y artefactos), los artefactos
# sueltos y las cachés. Nunca toca una ejecución en curso.
name: Limpiar Actions

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar ejecuciones terminadas, artefactos y cachés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
        run: |
          set -u
          echo "Artefactos:"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "  borrado $id"
          done
          echo "Cachés:"
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[].id' | while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" && echo "  borrada $id"
          done
          echo "Ejecuciones terminadas:"
          n=0
          gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[].id' | while read -r id; do
            [ "$id" = "$ME" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && n=$((n+1)) && echo "  borrada $id"
          done
          echo "Quedan:"
          gh api "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | "  \(.id) \(.name) \(.status)"'
          gh api "repos/$REPO/actions/cache/usage" || true
