[package]
name = "pyx"
version = "1.3.1"
description = "Editor LaTeX con celdas Python tipo Jupyter"
authors = ["Lorgio"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# One running app per machine: double-clicking a second .pltx opens it in the
# window that is already up (and reuses its Python kernel) instead of starting
# a second copy of the whole application.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# .pltx container = ZIP (Word-style): source + build artifacts, minus the PDF.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
