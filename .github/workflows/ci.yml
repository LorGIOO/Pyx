name: CI

# Comprueba en cada push / pull request que el proyecto compila (frontend + Rust).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, el mismo con el que se desarrolla. Con Node 20 fallaban tres
      # pruebas por el propio Node y no por la app: le falta
      # Promise.withResolvers (que usa PDF.js) y su TextDecoder de
      # Windows-1252 no trata bien los bytes 0x80-0x9F. En la app esas dos
      # cosas las pone el WebView, no Node.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar frontend
        run: npm run build

      - name: Comprobar Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
